name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production builds select the LIVE Stripe payment links (src/data/stripe.ts).
      # Also prerenders every route (scripts/prerender.mjs).
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Add CNAME
        run: echo "trendev.fr" > build/CNAME

      # No route list here any more: `npm run build` prerenders every route in
      # src/app/staticRoutes.ts to its own HTML file (real HTTP 200 entry
      # points for Stripe and legal references), plus 404.html (the SPA
      # fallback), sitemap.xml and robots.txt. See scripts/prerender.mjs.
      - name: Check prerendered output
        run: node scripts/check-seo.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
