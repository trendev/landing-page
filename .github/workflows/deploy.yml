name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TEMPORARY (issue #16): the deployed site is built in Stripe TEST mode
      # so friendly reviewers can walk the whole purchase funnel end to end
      # with Stripe test cards. Consequence: every visitor to trendev.fr gets
      # test checkout, which moves no real money and shows Stripe's TEST MODE
      # banner. Remove this `env:` block before launch, in the same change that
      # fills in LIVE_PAYMENT_LINKS -- a live site silently in test mode takes
      # no orders at all, and nothing else in the UI signals which mode it is.
      - name: Build
        env:
          VITE_STRIPE_MODE: test
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Add CNAME
        run: echo "trendev.fr" > build/CNAME

      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      # Real HTTP 200 entry points for the router's static routes (Stripe and
      # legal references must not resolve through the 404-status SPA fallback).
      # Keep this list in sync with src/app/router.tsx and src/data/terms/.
      - name: Add per-route entry points
        run: |
          for route in advisory \
                       services/cto-advisor services/cto-advisor-plus services/fractional-cto \
                       terms terms/2026-09-01 legal privacy welcome; do
            mkdir -p "build/$route"
            cp build/index.html "build/$route/index.html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
