
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#070C1C" />
      <meta name="robots" content="%SITE_ROBOTS%" />
      <meta name="description" content="%SITE_DESCRIPTION%" />
      <meta name="keywords" content="%SITE_KEYWORDS%" />
      <link rel="canonical" href="%SITE_CANONICAL%" />
      <!-- Landing values come from src/data/siteMeta.ts (vite.config.ts fills
           the %SITE_*% placeholders); scripts/prerender.mjs then rewrites the
           title, description, canonical, robots and og/twitter url, title and
           description for each subpage. -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="TRENDev Consulting" />
      <meta property="og:locale" content="en_GB" />
      <meta property="og:url" content="%SITE_CANONICAL%" />
      <meta property="og:title" content="%SITE_OG_TITLE%" />
      <meta property="og:description" content="%SITE_OG_DESCRIPTION%" />
      <meta property="og:image" content="https://trendev.fr/og-image.jpg" />
      <meta property="og:image:type" content="image/jpeg" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="TRENDev: CTO advisory, technical due diligence and delivery" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:url" content="%SITE_CANONICAL%" />
      <meta name="twitter:title" content="%SITE_OG_TITLE%" />
      <meta name="twitter:description" content="%SITE_OG_DESCRIPTION%" />
      <meta name="twitter:image" content="https://trendev.fr/og-image.jpg" />
      <link rel="icon" type="image/svg+xml" href="/logo.svg" />
      <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <title>%SITE_TITLE%</title>
      <!-- Google tag (gtag.js) — consent-gated.
           Only the dataLayer/gtag stub and a denied Consent Mode default live
           here. gtag.js is fetched, and 'config' called, only after the
           visitor accepts analytics cookies; see src/lib/analytics.ts. -->
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied'
        });
        gtag('js', new Date());
      </script>
      <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "@id": "https://trendev.fr/#organization",
          "name": "TRENDev Consulting",
          "url": "https://trendev.fr/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://trendev.fr/logo-512.png",
            "width": 512,
            "height": 512
          },
          "description": "Technology consulting and delivery for founders, growing startups and investors: CTO advisory, technical due diligence, Fractional CTO leadership and scoped implementation across AI, cloud and software engineering.",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "sales",
            "email": "contact@trendev.fr",
            "availableLanguage": ["en", "fr"]
          },
          "sameAs": [
            "https://github.com/trendev",
            "https://medium.com/tales-of-a-cto"
          ],
          "knowsAbout": [
            "CTO as a Service",
            "Fractional CTO",
            "CTO advisory",
            "Technical due diligence",
            "Engineering leadership",
            "Enterprise architecture",
            "AI consulting",
            "Cloud strategy",
            "DevOps consulting",
            "Full-stack development",
            "Blockchain development",
            "Smart contract development"
          ],
          "areaServed": ["Europe", "North America"]
        }
      </script>
      <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "@id": "https://trendev.fr/#website",
          "url": "https://trendev.fr/",
          "name": "TRENDev Consulting",
          "inLanguage": "en",
          "publisher": { "@id": "https://trendev.fr/#organization" }
        }
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
